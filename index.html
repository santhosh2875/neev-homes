<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neev Homes | Custom houses, designed and built in Bengaluru</title>
  <meta name="description" content="Neev designs and builds one-off houses in Bengaluru. Watch a house go up from bare plot to handover, pick your kitchen and garden, and see the estimate change as you choose.">
  <meta name="theme-color" content="#131c26">
  <script>document.documentElement.classList.add("js");</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#kitchen">Skip the build film</a>

  <header class="bar" id="bar">
    <a class="mark" href="#top"><span id="brand">Neev</span> <small id="brandSub">Homes</small></a>
    <div class="bar-right">
      <p class="est" id="est"><span class="est-label">Est.</span> <span id="estValue" aria-live="polite"></span></p>
      <a class="btn" href="#start" id="barStart">Start my build</a>
    </div>
  </header>

  <main>
    <!-- Opening: the page pins, and scrolling builds the house -->
    <section class="build" id="top" aria-label="A house being built, from bare plot to handover">
      <div class="build-pin">
        <canvas class="build-film" id="film" aria-hidden="true"></canvas>
        <div class="build-shade" aria-hidden="true"></div>
        <div class="captions" id="captions"></div>

        <!-- The levelling staff: the weeks of the build, rising with the house -->
        <div class="staff" id="staff">
          <p class="staff-read" aria-hidden="true"><span class="tag">Week</span><b id="staffWeek">0</b><span class="tag" id="staffOf"></span></p>
          <div class="staff-line" aria-hidden="true"><span class="staff-fill"></span><span class="staff-head"></span></div>
          <ol class="staff-stops" id="stops" aria-label="Jump to a stage of the build"></ol>
        </div>

        <button class="watch" id="watch" type="button"><span class="watch-icon" aria-hidden="true"></span><span id="watchText">Watch the build</span></button>
        <div class="build-bar" aria-hidden="true"><span id="buildBar"></span></div>
      </div>
    </section>

    <!-- Kitchen and garden: filled in from config.js -->
    <div id="rooms"></div>

    <!-- The estimate sheet and the form -->
    <section class="start" id="start">
      <div class="wrap start-grid">
        <div>
          <p class="tag">Estimate</p>
          <h2 class="display" id="startTitle"></h2>
          <dl class="sheet" id="sheet"></dl>
          <p class="start-note" id="startText"></p>
        </div>
        <form class="form" id="startForm" novalidate>
          <div class="field">
            <label for="fName">Your name</label>
            <input id="fName" name="name" type="text" autocomplete="name" required aria-describedby="fNameErr">
            <p class="field-error" id="fNameErr"></p>
          </div>
          <div class="field">
            <label for="fPhone">Phone number</label>
            <input id="fPhone" name="phone" type="tel" autocomplete="tel" required aria-describedby="fPhoneErr">
            <p class="field-error" id="fPhoneErr"></p>
          </div>
          <div class="field">
            <label for="fPlot">Where is your plot? <span class="optional">(optional)</span></label>
            <input id="fPlot" name="plot" type="text">
          </div>
          <div class="field">
            <label for="fNote">Anything we should know? <span class="optional">(optional)</span></label>
            <textarea id="fNote" name="note" rows="3"></textarea>
          </div>
          <button class="btn btn-big" type="submit" id="startButton">Start my build</button>
          <p class="form-status" id="formStatus" role="status"></p>
          <p class="form-contact"><a id="startPhone"></a> · <a id="startEmail"></a></p>
        </form>
      </div>
      <div class="wrap">
        <ul class="promises" id="promises"></ul>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer-row">
      <p class="footer-mark" id="footMark">Neev</p>
      <p id="footCity"></p>
      <p class="footer-note">Demo site. The company, prices and contact details are invented, and the pictures are computer-generated.</p>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
